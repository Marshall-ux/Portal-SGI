# Presentación del portal. Lo que no está acá sale del disco I.

# Archivos del disco que el portal no publica, además de los técnicos de PORTAL_EXCLUSIONES
# (mismo formato: nombre del archivo, con comodines, sin distinguir mayúsculas).
# La Guía de Acceso queda afuera porque las tarjetas de Documentación de la home ya llevan a
# cada carpeta y sus enlaces apuntan al sitio anterior (http://192.168.41.5), que se da de baja.
no_publicar = ["00. Gu*a de Acceso*"]

# Accesos rápidos de la home, en este orden. "documento" es la dirección del documento en el
# portal (lo que sigue a /d/ al abrirlo), que no incluye la revisión: cuando SGI sube una
# revisión nueva, el acceso abre la nueva sin tocar nada. Si el documento cambia de nombre,
# hay que actualizar la dirección acá; mientras tanto, el reporte del disco lo avisa.
# "titulo" es opcional (si falta, se usa el nombre del archivo). Íconos: mapa, politica, organigrama, documento.
[[accesos]]
documento = "mapa-de-proceso"
icono = "mapa"

[[accesos]]
documento = "manuales-y-documentacion-neostar/manual-integrado/2-0-politica-de-calidad-medio-ambiente-seguridad-y-salud-en-el-trabajo"
titulo = "Política del Sistema de Gestión Integrado"
icono = "politica"

[[accesos]]
documento = "manuales-y-documentacion-neostar/manual-integrado/f-1-0-01-organigrama"
titulo = "Organigrama"
icono = "organigrama"

# Las secciones se identifican por el slug del nombre de su carpeta, sin el número
# de orden: "01. MANUALES  Y DOCUMENTACIÓN NEOSTAR" → manuales-y-documentacion-neostar.
# Una carpeta que no figura acá aparece igual, con su nombre y un ícono genérico.
# Íconos disponibles: manuales, puestos, capacitaciones, controles, cronogramas,
# buzones, encuestas, carpeta.
#
# Una sección con "enlace" no muestra los documentos del disco: su tarjeta abre esa dirección
# (en otra pestaña) y lo que haya en su carpeta deja de aparecer en el portal y en el buscador.
# La tarjeta sigue en la home aunque la carpeta quede vacía o se borre del disco; por eso
# lleva "orden" (el número que tenía la carpeta), para conservar su lugar. "enlace_nota" es
# el texto chico al pie de la tarjeta.

[secciones.manuales-y-documentacion-neostar]
titulo = "Manuales y Documentación"
descripcion = "Manual Integrado, procedimientos, instructivos y formularios."
icono = "manuales"

[secciones.puestos-de-trabajo-y-documentacion-asociada]
titulo = "Puestos de Trabajo y Documentación Asociada"
descripcion = "Perfiles, riesgos, planes de emergencia, aspectos e impactos ambientales."
icono = "puestos"

[secciones.capacitaciones-neostar]
titulo = "Capacitaciones"
descripcion = "Material vigente de capacitaciones, en el espacio de RRHH."
icono = "capacitaciones"
# El material de capacitaciones lo mantiene RRHH: una sola fuente, sin copias en el disco SGI.
enlace = "https://multiversorrhh.com/mi-neoschool"
enlace_nota = "Capacitaciones de RRHH"
orden = 3

[secciones.controles-operativos-neostar]
titulo = "Controles Operativos"
descripcion = "Auditorías internas de ventas, posventa y administración."
icono = "controles"

[secciones.cronogramas]
titulo = "Cronogramas"
descripcion = "Programas anuales de capacitación, auditorías y más."
icono = "cronogramas"

[secciones.buzones-de-participacion-y-consulta]
titulo = "Buzones de Participación y Consulta"
descripcion = "No conformidades, oportunidades de mejora y sugerencias."
icono = "buzones"

[secciones.encuestas]
titulo = "Encuestas"
descripcion = "Análisis de encuestas de clientes y posventa."
icono = "encuestas"

# Certificación vigente. Al renovarla: regenerar el sello con tools/render_sello.py
# y actualizar estos datos.
# Los textos también se editan acá: "cierre" es la frase destacada al final del recuadro,
# [certificacion.descripcion] es la presentación del SGI y cada norma lleva la explicación
# que se despliega al hacer clic en ella ("titulo", "introduccion", "aplicacion" con un
# párrafo por elemento, y "compromiso"). Una norma sin "introduccion" se muestra sin desplegable.
[certificacion]
certificador = "TÜV Rheinland"
id = "9000015845"
sello = "img/certificacion/tuv-rheinland-9000015845"  # sin "-1200.png" / "-2400.png"
verificar_url = "http://m.certipedia.com/?id=9000015845"  # la misma dirección que el QR del sello
cierre = "El SGI no es responsabilidad de una sola área. Cada colaborador contribuye a su cumplimiento a través de sus decisiones y acciones diarias."

[certificacion.descripcion]
titulo = "¿Qué es nuestro Sistema de Gestión Integrado?"
parrafos = [
  "En Neostar, el Sistema de Gestión Integrado (SGI) forma parte de nuestra manera de trabajar. Nos permite organizar y mejorar continuamente nuestros procesos, cumplir con los requisitos aplicables, prevenir riesgos y fortalecer tres compromisos fundamentales: brindar servicios de calidad, cuidar el medio ambiente y proteger la seguridad y salud de las personas.",
  "El SGI está presente en todas nuestras concesionarias, desde la atención al cliente y la entrega de vehículos hasta las actividades de taller, administración y servicios de apoyo.",
]

[[certificacion.normas]]
norma = "ISO 9001:2015"
nombre = "Calidad"
icono = "calidad"
titulo = "Gestión de la Calidad"
introduccion = "La calidad está presente en cada etapa de nuestra relación con el cliente y en los procesos que nos permiten brindar un buen servicio."
aplicacion = [
  "Cuando brindamos información clara sobre un vehículo, cumplimos con lo acordado en una operación, verificamos las condiciones de una unidad antes de entregarla, realizamos los controles de un servicio de taller o gestionamos un reclamo para evitar que vuelva a ocurrir.",
  "También cuando seguimos nuestros procedimientos, mantenemos registros confiables y buscamos mejorar nuestra manera de trabajar.",
]
compromiso = "trabajar de forma organizada, cumplir los requisitos y mejorar continuamente la satisfacción de nuestros clientes."

[[certificacion.normas]]
norma = "ISO 14001:2015"
nombre = "Medio Ambiente"
icono = "ambiente"
titulo = "Gestión Ambiental"
introduccion = "Nuestras actividades generan impactos ambientales que debemos identificar, prevenir y controlar, tanto en los talleres como en las áreas comerciales y administrativas."
aplicacion = [
  "Cuando separamos y disponemos correctamente los residuos, gestionamos los aceites usados, filtros y otros materiales provenientes del taller, evitamos derrames, controlamos los efluentes de los lavaderos o hacemos un uso responsable del agua, la energía y el papel.",
  "También cuando identificamos situaciones que podrían generar contaminación y tomamos medidas para prevenirlas.",
]
compromiso = "reducir nuestro impacto ambiental, cumplir los requisitos aplicables y utilizar responsablemente los recursos."

[[certificacion.normas]]
norma = "ISO 45001:2018"
nombre = "Seguridad y Salud en el Trabajo"
icono = "seguridad"
titulo = "Seguridad y Salud en el Trabajo"
introduccion = "La seguridad y la salud son responsabilidad de todos. Cada puesto de trabajo presenta riesgos que debemos conocer y prevenir para desarrollar nuestras actividades de manera segura."
aplicacion = [
  "Cuando utilizamos los elementos de protección personal correspondientes, mantenemos despejadas las salidas de emergencia, respetamos las señalizaciones, manipulamos correctamente herramientas y equipos o informamos sobre una condición insegura.",
  "También cuando participamos en capacitaciones, simulacros de evacuación e identificamos riesgos en nuestras tareas, ya sea en un taller, salón de ventas, depósito u oficina.",
]
compromiso = "prevenir lesiones y enfermedades laborales, reducir los riesgos y promover ambientes de trabajo seguros y saludables."

# Canales de participación y reporte: un bloque al final de la home, con una tarjeta por canal
# en este orden. El QR de cada tarjeta se genera solo a partir de "url": si cambia el
# formulario, alcanza con cambiar la dirección acá.
# Cada canal: "nombre", "publico" ("externo" muestra «Público interno y externo», "interno"
# muestra «Uso interno»), "alcance" (opcional, a quién está dirigido), "pregunta", "descripcion",
# "ejemplo" (se muestra después de «Por ejemplo:»), "nota" con su "nota_titulo" opcional,
# "importante" (recuadro de advertencia), "url" e "icono".
# Íconos disponibles: buzones, no-conformidad, mejora, incidente, denuncia.
[canales]
titulo = "Canales de Participación y Reporte"
lema = "Tu voz cuenta. ¡Sé parte de la mejora!"
descripcion = "En Neostar contamos con distintos canales para compartir sugerencias, comunicar incumplimientos, proponer mejoras y reportar situaciones que requieren atención."
indicacion = "Elegí el canal adecuado según lo que necesites informar."

[[canales.lista]]
nombre = "Buzón de Sugerencias"
publico = "externo"
pregunta = "¿Tenés una idea, sugerencia, inquietud o reclamo que quieras compartir?"
descripcion = "Este buzón permite comunicar propuestas para mejorar nuestros servicios, procesos o instalaciones. También recibe quejas y reclamos de clientes, proveedores y vecinos relacionados con nuestras concesionarias."
ejemplo = "sugerir una mejora en la atención, comunicar una disconformidad con un servicio o informar molestias ocasionadas por las actividades de una sucursal."
url = "https://forms.gle/vrp97hmSJcEJTNYt6"
icono = "buzones"

# NC y OM comparten el formulario, pero se muestran como dos canales.
[[canales.lista]]
nombre = "No Conformidades (NC)"
publico = "interno"
alcance = "Colaboradores de las concesionarias Neostar"
pregunta = "¿Detectaste algo que no cumple con un requisito o procedimiento establecido?"
descripcion = "Utilizá este canal para informar incumplimientos que requieren corrección, análisis de sus causas y acciones para evitar que se repitan."
ejemplo = "un control obligatorio que no se realizó, un procedimiento que no se cumplió o un registro requerido que no fue completado."
url = "https://forms.gle/wLXx5mh5tNHD6tXKA"
icono = "no-conformidad"

[[canales.lista]]
nombre = "Oportunidades de Mejora (OM)"
publico = "interno"
alcance = "Colaboradores de las concesionarias Neostar"
pregunta = "¿Identificaste algo que podemos hacer mejor, aunque no exista un incumplimiento?"
descripcion = "Este canal permite proponer mejoras para optimizar procesos, prevenir dificultades y facilitar nuestras tareas cotidianas."
ejemplo = "mejorar la organización de herramientas, simplificar un registro o incorporar una medida preventiva."
url = "https://forms.gle/wLXx5mh5tNHD6tXKA"
icono = "mejora"

[[canales.lista]]
nombre = "Reporte de Incidentes"
publico = "interno"
alcance = "Colaboradores de las concesionarias Neostar"
pregunta = "¿Ocurrió una situación que pudo haber provocado un accidente?"
descripcion = "Utilizá este canal para informar incidentes o situaciones imprevistas que, aunque no hayan ocasionado lesiones ni daños, podrían haber generado un accidente."
ejemplo = "un colaborador resbala sin llegar a caerse, una herramienta cae cerca de una persona sin golpearla o un vehículo realiza una maniobra que casi provoca una colisión."
nota_titulo = "¿Por qué es importante reportarlos?"
nota = "Porque nos permite identificar riesgos, analizar lo ocurrido e implementar medidas preventivas antes de que se produzca un accidente."
importante = "si ocurre un accidente o una emergencia, comunicá inmediatamente la situación al responsable correspondiente y seguí los procedimientos establecidos. Este buzón no reemplaza esos canales de comunicación."
url = "https://forms.gle/g1eccPX7eRqadTX77"
icono = "incidente"

[[canales.lista]]
nombre = "Canal de Denuncias – Código de Ética"
publico = "interno"
alcance = "Colaboradores de las concesionarias Neostar"
pregunta = "¿Conocés o sospechás de una conducta contraria a nuestros principios éticos?"
descripcion = "Este canal permite informar situaciones que puedan vulnerar el respeto, la integridad, la transparencia o las normas de conducta establecidas en nuestro Código de Ética."
ejemplo = "situaciones de discriminación, acoso, abuso de autoridad, corrupción, conflictos de intereses o uso indebido de información confidencial."
nota = "Las denuncias se gestionan de manera confidencial e imparcial, con protección frente a represalias para quienes actúen de buena fe, conforme a lo establecido en el Código de Ética."
url = "https://forms.gle/16V1RJrpnqMJFW4v8"
icono = "denuncia"
