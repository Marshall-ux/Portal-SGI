# Portal SGI: sincronización del disco (sgi-sync) y app web (sgi-web).
#
# En el servidor corre como proyecto propio en /opt/portal/portal-interno/portal-sgi, con
# docker-compose.servidor.yml para unirse a la red del portal; el nginx de portal-interno
# lo publica en /sgi/ (ver README, "Despliegue").
#
# Qué archivos se combinan lo define COMPOSE_FILE en el .env: en el servidor, con
# docker-compose.servidor.yml; en desarrollo, con docker-compose.dev.yml (copia local del
# disco y nginx de prueba en http://localhost:8096/sgi/). Después: docker compose up -d --build
name: portal-sgi

services:
  sgi-sync:
    build: ./sync
    env_file: .env
    volumes:
      - disco-sgi:/mnt/disco:ro
      - sgi-data:/data
    restart: always

  sgi-web:
    build: ./web
    env_file: .env
    volumes:
      - sgi-data:/data:ro
    restart: always

volumes:
  # Copias del disco, el enlace "current", sync.json y los logs.
  sgi-data:

  # Disco I de SGI: Docker monta el recurso SMB en solo lectura al iniciar sgi-sync.
  disco-sgi:
    driver: local
    driver_opts:
      type: cifs
      device: "//${SMB_SERVIDOR:-192.168.41.5}/${SMB_RECURSO:-iso}"
      o: "addr=${SMB_SERVIDOR:-192.168.41.5},username=${SMB_USUARIO:-},password=${SMB_CLAVE:-},domain=${SMB_DOMINIO:-WORKGROUP},vers=${SMB_VERSION:-2.1},ro,iocharset=utf8,noperm"
