# Desarrollo local:
#  - sgi-sync usa una copia del disco SGI en esta PC (SGI_DISCO_LOCAL) en lugar del recurso SMB;
#  - sgi-web queda accesible directo en http://localhost:8095/;
#  - nginx-dev usa el mismo bloque /sgi/ que el nginx del servidor: http://localhost:8096/sgi/
#
# Se activa con COMPOSE_FILE=docker-compose.yml:docker-compose.dev.yml en el .env.
services:
  sgi-sync:
    volumes:
      - ${SGI_DISCO_LOCAL:?Definí SGI_DISCO_LOCAL en .env}:/mnt/disco:ro

  sgi-web:
    ports:
      - "8095:5001"

  nginx-dev:
    image: nginx:alpine
    ports:
      - "8096:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sgi.conf:/etc/nginx/sgi.conf:ro
