# Desarrollo local:
#  - sgi-sync usa una copia del disco SGI en esta PC (SGI_DISCO_LOCAL) en lugar del recurso SMB;
#  - sgi-web queda accesible directo en http://localhost:8095/;
#  - nginx-dev simula el nginx de portal-interno: http://localhost:8096/sgi/
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
services:
  sgi-sync:
    volumes:
      - ${SGI_DISCO_LOCAL:?Definí SGI_DISCO_LOCAL en .env}:/mnt/disco:ro

  sgi-web:
    ports:
      - "8095:5001"

  nginx-dev:
    image: nginx:alpine
    ports:
      - "8096:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/sgi.conf:/etc/nginx/sgi.conf:ro
