# Portal SGI en /sgi/. Va dentro del bloque "server" del nginx de portal-interno:
#     include /etc/nginx/sgi.conf;
#
# La dirección de sgi-web se resuelve en cada pedido (DNS interno de Docker) en lugar de
# al arrancar: si el portal SGI está caído, nginx arranca igual y las demás apps siguen
# funcionando; /sgi/ responde 502 hasta que vuelva.

location = /sgi {
    absolute_redirect off;
    return 301 /sgi/;
}

location /sgi/ {
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $sgi_web sgi-web:5001;
    rewrite ^/sgi/(.*)$ /$1 break;
    proxy_pass http://$sgi_web;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sgi;   # la app arma sus enlaces con /sgi/

    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;                     # documentos grandes (la Guía pesa ~50 MB)
}
