# Portal SGI en /sgi/. En el servidor, este bloque se pega dentro del "server" de
# /opt/portal/portal-interno/nginx/nginx.conf (con el mismo formato que stock-manager)
# y se recarga nginx; no hace falta reiniciar ningún contenedor.
#
# sgi-web se resuelve en cada pedido (DNS interno de Docker): si el portal SGI está
# caído, nginx sigue funcionando para las demás apps y /sgi/ responde 502 hasta que vuelva.

location = /sgi {
    absolute_redirect off;
    return 301 /sgi/;
}

location /sgi/ {
    resolver 127.0.0.11 valid=10s ipv6=off;    # ya está a nivel server en portal-interno; se repite para dev
    set $up_sgi sgi-web:5001;
    rewrite ^/sgi/(.*)$ /$1 break;
    proxy_pass http://$up_sgi;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Prefix /sgi;    # la app arma sus enlaces con /sgi/
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;                      # documentos grandes (la Guía pesa ~50 MB)
}
