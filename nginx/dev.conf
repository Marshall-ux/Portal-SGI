# Solo desarrollo: nginx mínimo con el bloque de sgi.conf. En el servidor ese bloque no se
# incluye: se pega dentro del nginx.conf de portal-interno (ver README, "Despliegue").
events {
    worker_connections 1024;
}
http {
    server {
        listen 80;

        location = / {
            absolute_redirect off;
            return 302 /sgi/;
        }

        include /etc/nginx/sgi.conf;
    }
}
